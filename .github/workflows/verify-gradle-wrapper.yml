name: Verify Gradle Wrapper Checksum

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-wrapper-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify wrapper checksum
        run: ./scripts/verify-gradle-wrapper-sha.sh verify
